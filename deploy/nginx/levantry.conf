# Levantry — levantry.app
#
# Canonical documentation: docs/DEPLOYMENT.md
# Installed on the VM as /etc/nginx/sites-available/levantry.conf and symlinked
# into sites-enabled/ by scripts/provision-server.sh.
#
# Every path below belongs to Levantry. This file must never reference, include
# or depend on any other application hosted on the same machine.
#
# Written for nginx 1.24 (Ubuntu), which predates the `http2 on;` directive, so
# HTTP/2 is enabled with the older `listen ... http2` form.

# --- port 80: ACME challenges, everything else upgraded to HTTPS ------------
server {
    listen 80;
    listen [::]:80;
    server_name levantry.app www.levantry.app;

    # Certbot's webroot plugin drops challenge files here. Kept inside
    # Levantry's own tree so renewal never depends on a shared directory.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/levantry/acme;
    }

    location / {
        return 301 https://levantry.app$request_uri;
    }
}

# --- www: permanent redirect to the apex ------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.levantry.app;

    ssl_certificate     /etc/letsencrypt/live/levantry.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levantry.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://levantry.app$request_uri;
}

# --- the app ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name levantry.app;

    # A symlink to the live release. scripts/deploy.sh swaps it with a single
    # atomic rename, so a request never sees a half-written directory.
    root /var/www/levantry/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/levantry.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/levantry.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/levantry.access.log;
    error_log  /var/log/nginx/levantry.error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Vite fingerprints these by content, so a given name never changes meaning
    # and can be cached for as long as the browser likes.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must never outlive a deploy: a stale index.html would go
    # on pointing at a hashed bundle that has already been pruned, which is the
    # one way this layout can serve a broken site.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Levantry routes with a HashRouter, so client routes arrive as /#/study/x
    # and the server is only ever asked for /. This fallback is therefore a
    # safety net rather than the mechanism that makes refresh work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
