  </defs>

  <rect width="1024" height="1024" rx="192" fill="url(#bloom)"/>
  <!-- Centred on the letterform's own box, then held at 1.28 so its diagonal stays
       inside the maskable safe circle that adaptive launchers crop to. -->
  <g transform="translate(512 512) scale(1.28) translate(-492 -466)">
    <!-- The stroke thickens the traced strokes by a few units each side; the drawn
         line is fine enough that a tab-sized favicon loses it otherwise. -->
    <use href="#glyph" fill="#cb5d39" stroke="#cb5d39" stroke-width="12" stroke-linejoin="round"
         filter="url(#halo)" opacity="0.85"/>
    <use href="#glyph" fill="#f1ead8" stroke="#f1ead8" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
