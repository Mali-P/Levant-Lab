<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Levantry">
  <defs>
    <!-- The bloom behind the sign: warm at the centre, falling to bare stone. -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#4a2a1c"/>
      <stop offset="55%" stop-color="#2b2320"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <!-- Neon reads as a soft halo under a crisp tube, so the mark is drawn twice. -->
    <filter id="halo" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <!-- The letterform alone. Both hexagons are gone: at 16px their frames ate the
         glyph's share of the tile, and what survived was a ring, not a sign. -->
    <path id="glyph" fill-rule="evenodd" clip-rule="evenodd" d="M 503 378 L 497 378 L 496 377 L 495 378 L 500 384 L 506 396 L 508 406 L 509 407 L 509 410 L 510 411 L 511 425 L 512 426 L 512 440 L 513 441 L 514 504 L 515 505 L 515 507 L 509 513 L 508 513 L 496 526 L 488 537 L 482 549 L 482 551 L 480 555 L 480 558 L 479 559 L 479 563 L 478 564 L 478 585 L 479 586 L 479 591 L 480 592 L 481 599 L 484 607 L 487 587 L 488 586 L 489 579 L 491 576 L 492 571 L 500 556 L 506 548 L 515 539 L 517 541 L 517 574 L 518 575 L 517 576 L 518 577 L 518 645 L 517 646 L 517 651 L 516 652 L 515 659 L 508 672 L 495 684 L 485 689 L 483 689 L 476 692 L 472 692 L 471 693 L 450 693 L 449 692 L 441 691 L 440 690 L 432 688 L 424 684 L 411 675 L 397 660 L 391 651 L 384 637 L 384 635 L 380 625 L 379 618 L 378 617 L 377 607 L 376 606 L 376 597 L 375 596 L 376 575 L 377 574 L 377 570 L 378 569 L 379 561 L 380 560 L 383 549 L 396 525 L 406 513 L 406 512 L 428 490 L 429 490 L 432 486 L 421 488 L 406 495 L 387 509 L 375 522 L 366 535 L 359 549 L 359 551 L 355 559 L 355 562 L 352 569 L 351 577 L 350 578 L 350 582 L 349 583 L 348 599 L 347 600 L 347 615 L 348 616 L 349 635 L 350 636 L 350 640 L 351 641 L 351 645 L 352 646 L 353 653 L 354 654 L 358 668 L 365 683 L 377 701 L 393 717 L 401 723 L 416 731 L 421 732 L 424 734 L 435 736 L 436 737 L 443 737 L 444 738 L 468 738 L 469 737 L 479 736 L 480 735 L 491 732 L 509 722 L 523 709 L 531 697 L 536 686 L 536 684 L 539 677 L 540 670 L 541 669 L 541 665 L 542 664 L 543 648 L 544 647 L 544 619 L 545 618 L 545 514 L 546 513 L 545 511 L 545 503 L 546 502 L 546 425 L 545 424 L 545 417 L 544 416 L 544 413 L 543 412 L 542 407 L 539 401 L 527 388 L 516 382 L 514 382 L 511 380 L 504 379 Z M 435 194 L 432 199 L 432 201 L 428 208 L 428 210 L 424 217 L 424 219 L 415 238 L 421 241 L 423 241 L 444 252 L 454 263 L 454 266 L 455 267 L 455 275 L 454 276 L 454 284 L 453 285 L 453 292 L 452 293 L 452 300 L 451 301 L 451 328 L 452 329 L 452 337 L 453 338 L 453 347 L 454 348 L 57